      - joint_set_id: set-1
        p32:
          lower: 0.01
          upper: 10
          unit: m^2/m^3
          coordinate: log
          upper_inclusive: true
        size_r_min_m:
          lower: 1
          upper: 150
          unit: m
          coordinate: log
          upper_inclusive: true
        size_r_max_m:
          lower: 1
