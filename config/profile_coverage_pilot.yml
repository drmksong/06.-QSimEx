profile_mc_exploration:
  # Reachability pilot only; do not treat as final calibration or validation data.
  case_paths:
    - cases/scenario_11_coverage_low_q.yaml
    - cases/scenario_12_coverage_high_q.yaml
  seed_range:
    start: 200
    stop: 204
    step: 1
  face_positions: [10, 20, 30]
  borehole_window: 3
  backend: mlx
  batch_size: 100
  correction_mode: pure
  output_dir: results/profile_mc_coverage_pilot
  save_each_case: true
  save_combined: true
  verbose: true
