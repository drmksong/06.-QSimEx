  - "Current in-flight job DFN/intermediate state is not persisted before atomic job completion; that job may need regeneration after interruption."
  - "The maximum simulation cap and unresolved goal status apply to one command invocation and are returned in memory; each resume invocation takes a new cap, and those run-level statuses are not persisted in schema v2."
