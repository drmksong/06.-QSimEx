profile_mc_exploration:
  # Common-seed provenance round for the previously observed low/high reachability signatures.
  # This is a coverage screening round, not calibration or validation data.
  case_paths:
    - cases/scenario_13_coverage_low_q_refined.yaml
    - cases/scenario_12_coverage_high_q.yaml
  seed_range:
    start: 300
    stop: 300
    step: 1
  face_positions: [10, 20, 30]
  borehole_window: 3
  backend: mlx
  batch_size: 100
  correction_mode: pure
  output_dir: results/profile_mc_coverage_round_003_reachability
  save_each_case: true
  save_combined: true
  checkpoint_on_seed: true
  verbose: true
