name: scenario_05_orthogonal_two_sets
description: Two orthogonal anisotropic sets

seed: 46
tags:
  quality_regime: orthogonal
  density_regime: moderate
  orientation_regime: anisotropic

domain:
  nx: 60
  ny: 30
  nz: 30
  dx: 1.0
  dy: 1.0
  dz: 1.0

tunnel:
  center_y: 15.0
  center_z: 15.0
  radius: 5.0

boreholes:
  - { dy: 0.0, dz: 0.0 }

rqd:
  scan_length: 5.0

global_params:
  Jw_mean: 0.8
  Jw_std: 0.1
  SRF_mean: 1.0
  SRF_std: 0.3

joint_sets:
  - set_id: 1
    name: set_A
    mean_dip: 20
    mean_dip_dir: 90
    fisher_kappa: 60
    size_alpha: 3.0
    size_r_min: 0.5
    size_r_max: 20.0
    density_type: P32
    P32: 1.5
    mean_spacing: 1.0
    Jr_mean: 1.6
    Jr_std: 0.3
    Ja_mean: 1.5
    Ja_std: 0.4
  - set_id: 2
    name: set_B
    mean_dip: 70
    mean_dip_dir: 270
    fisher_kappa: 60
    size_alpha: 3.0
    size_r_min: 0.5
    size_r_max: 20.0
    density_type: P32
    P32: 1.5
    mean_spacing: 1.0
    Jr_mean: 1.6
    Jr_std: 0.3
    Ja_mean: 1.5
    Ja_std: 0.4

cost:
  cost_fp: 1
  cost_fn: 5