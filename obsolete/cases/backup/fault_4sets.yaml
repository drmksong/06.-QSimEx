cost:
  cost_fp: 1
  cost_fn: 5

name: "fault_zone_4sets"
description: "단층대 4개 절리군 — 파쇄대, 불량 암반"
seed: 789

domain:
  nx: 100
  ny: 50
  nz: 50
  dx: 1.0
  dy: 1.0
  dz: 1.0

tunnel:
  center_y: 25.0
  center_z: 25.0
  radius: 5.0

boreholes:
  - { dy: 0.0, dz: 0.0 }
  - { dy: 0.0, dz: 3.0 }
  - { dy: 0.0, dz: -3.0 }

rqd:
  scan_length: 5.0

global_params:
  Jw_mean: 0.33
  Jw_std: 0.15
  SRF_mean: 7.5
  SRF_std: 3.0

joint_sets:
  - set_id: 1
    name: "단층면"
    mean_dip: 60
    mean_dip_dir: 270
    fisher_kappa: 15
    size_alpha: 2.5
    size_r_min: 0.3
    size_r_max: 25.0
    density_type: "P32"
    P32: 2.5
    mean_spacing: 0.3
    Jr_mean: 1.0
    Jr_std: 0.3
    Ja_mean: 6.0
    Ja_std: 2.0

  - set_id: 2
    name: "전단 절리 A"
    mean_dip: 45
    mean_dip_dir: 0
    fisher_kappa: 10
    size_alpha: 2.8
    size_r_min: 0.2
    size_r_max: 12.0
    density_type: "P32"
    P32: 2.0
    mean_spacing: 0.3
    Jr_mean: 0.5
    Jr_std: 0.2
    Ja_mean: 4.0
    Ja_std: 1.5

  - set_id: 3
    name: "전단 절리 B"
    mean_dip: 50
    mean_dip_dir: 180
    fisher_kappa: 10
    size_alpha: 3.0
    size_r_min: 0.2
    size_r_max: 10.0
    density_type: "P32"
    P32: 1.8
    mean_spacing: 0.3
    Jr_mean: 1.0
    Jr_std: 0.2
    Ja_mean: 4.0
    Ja_std: 1.0

  - set_id: 4
    name: "인장 절리"
    mean_dip: 70
    mean_dip_dir: 90
    fisher_kappa: 20
    size_alpha: 3.5
    size_r_min: 0.1
    size_r_max: 8.0
    density_type: "P32"
    P32: 1.5
    mean_spacing: 0.5
    Jr_mean: 1.5
    Jr_std: 0.5
    Ja_mean: 3.0
    Ja_std: 1.0
