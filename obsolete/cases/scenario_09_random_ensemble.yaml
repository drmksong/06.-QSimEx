name: scenario_09_random_ensemble
description: Randomized ensemble (single YAML to trigger random sampling in runner)

seed: 50
tags:
  quality_regime: randomized
  density_regime: variable
  orientation_regime: variable

domain:
  nx: 60
  ny: 30
  nz: 30
  dx: 1.0
  dy: 1.0
  dz: 1.0

tunnel:
  center_y: 15.0
  center_z: 15.0
  radius: 5.0

boreholes:
  - { dy: 0.0, dz: 0.0 }

rqd:
  scan_length: 5.0

global_params:
  Jw_mean: 0.8
  Jw_std: 0.1
  SRF_mean: 1.0
  SRF_std: 0.3

# This YAML describes a randomized generator hint; actual randomization
# is implemented by the runner when requested. We provide a default single set.
joint_sets:
  - set_id: 1
    name: random_hint_set
    mean_dip: 45
    mean_dip_dir: 180
    fisher_kappa: 10
    size_alpha: 3.0
    size_r_min: 0.5
    size_r_max: 40.0
    density_type: P32
    P32: 1.0
    mean_spacing: 1.0
    Jr_mean: 1.5
    Jr_std: 0.3
    Ja_mean: 2.0
    Ja_std: 0.5

cost:
  cost_fp: 1
  cost_fn: 5