    Ja_std: 0.5
  - set_id: 2
    name: rare_large
    mean_dip: 50
    mean_dip_dir: 200
    fisher_kappa: 8
    size_alpha: 2.2
    size_r_min: 10.0
    size_r_max: 75.0
    density_type: P32
    P32: 0.2
    mean_spacing: 8.0
    Jr_mean: 1.0
    Jr_std: 0.5
