
name: scenario_04_two_populations
description: Two populations - dominant small + rare large
seed: 45
tags:
  quality_regime: mixed_sizes
  density_regime: mixed
  orientation_regime: mixed

domain:
  nx: 60
  ny: 30
  nz: 30
  dx: 1.0
  dy: 1.0
  dz: 1.0

tunnel:
  center_y: 15.0
  center_z: 15.0
